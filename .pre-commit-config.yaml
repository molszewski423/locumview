repos:
  - repo: https://github.com/ansible/ansible-lint
    rev: v26.9.0
    hooks:
      - id: ansible-lint
        # Upstream's .pre-commit-hooks.yaml hardcodes python3.14, which none of the
        # development machines have. Use the system python3 instead: 3.12 on RHEL 10.2,
        # 3.13 on openSUSE Leap 16 (devsuse), Fedora's current version on the laptop.
        language_version: python3
        files: ^ansible/.*\.(yml|yaml)$

  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: ['--baseline', '.secrets.baseline']
        # SOPS-encrypted values are false positives; sops-encrypted below guarantees these files hold no plain text.
        exclude: ^k8s/.*\.sops\.ya?ml$

  - repo: local
    hooks:
      - id: sops-encrypted
        name: SOPS files are encrypted (ADR 0003)
        entry: python3 scripts/check-sops-encrypted.py
        language: python
        additional_dependencies: ['pyyaml==6.0.3']
        files: ^k8s/.*\.sops\.ya?ml$

      - id: gitleaks
        name: gitleaks (podman, image pinned by digest)
        entry: >-
          docker.io/zricethezav/gitleaks:v8.30.1@sha256:b109bc5f8f76a38196a3e413704fc5b9e3c32360bce4e4b603bd6f45b3721dbb
          protect --staged --redact -v
        language: docker_image
        pass_filenames: false

      - id: kubeconform
        name: kubeconform (podman, image pinned by digest)
        # *.sops.yaml carry a top-level `sops:` block (invalid for strict schema); sops-encrypted covers them.
        entry: >-
          --entrypoint /kubeconform
          ghcr.io/yannh/kubeconform:v0.8.0@sha256:faffaf43f95aa6425306e1ab8d6fcad72acb9049158f38e574c085ea1ec0f64e
          -strict -summary
          -ignore-filename-pattern kustomization\.yaml$
          -ignore-filename-pattern \.sops\.ya?ml$
        language: docker_image
        files: ^k8s/.*\.ya?ml$
        # One container at a time: podman's :Z relabel gives each container its own SELinux label,
        # so parallel batches lock each other out of the repo (lstat: permission denied).
        require_serial: true

      - id: tflint
        name: tflint (podman, image pinned by digest)
        entry: >-
          ghcr.io/terraform-linters/tflint:v0.64.0@sha256:85c63179e53e69f48fb5d1e22fb6c2b4941049c7f906f30625defa6ffcc3f834
        language: docker_image
        pass_filenames: false
        files: \.tf$
