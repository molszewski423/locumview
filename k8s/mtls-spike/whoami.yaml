# traefik/whoami echoes the request, including the X-Forwarded-Tls-Client-Cert-Info header that routes.yaml adds.
apiVersion: apps/v1
kind: Deployment
metadata: {name: whoami, namespace: mtls-spike}
spec:
  replicas: 1
  selector: {matchLabels: {app: whoami}}
  template:
    metadata: {labels: {app: whoami}}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: whoami
          # v1.11.0, index digest checked 2026-10-27
          image: docker.io/traefik/whoami@sha256:200689790a0a0ea48ca45992e0450bc26ccab5307375b41c84dfc4f2475937ab
          args: [--port, "8080", --name, mtls-spike]
          ports: [{name: http, containerPort: 8080}]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits: {memory: 32Mi}
---
apiVersion: v1
kind: Service
metadata: {name: whoami, namespace: mtls-spike}
spec:
  selector: {app: whoami}
  ports: [{name: http, port: 80, targetPort: http}]
