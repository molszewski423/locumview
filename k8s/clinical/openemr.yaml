# OpenEMR 8.4.1 with LocumView's fixes (clinical/images/openemr/, signed by CI; the digest is set in
# kustomization.yaml). One replica: its sites/ volume is ReadWriteOnce. Served on port 80 to Traefik (TLS at the edge)
# and to the gateway. Its public address is set once in its globals (site_addr_oath) by the setup step.
apiVersion: v1
kind: Service
metadata: {name: openemr, namespace: clinical}
spec:
  selector: {app: openemr}
  ports: [{name: http, port: 80, targetPort: 80}]
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: {name: openemr-sites, namespace: clinical}
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources: {requests: {storage: 1Gi}}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: openemr, namespace: clinical}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector: {matchLabels: {app: openemr}}
  template:
    metadata: {labels: {app: openemr}}
    spec:
      nodeSelector: {kubernetes.io/hostname: CLINICAL_NODE}   # set from site.env
      automountServiceAccountToken: false
      securityContext:
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: openemr
          image: git.lan/mike/locumview-openemr   # digest set in kustomization.yaml (images)
          # MariaDB's first boot runs a temporary server without networking; OpenEMR's installer waits for the real one.
          command: ["sh", "-c", "until nc -w 1 mariadb 3306 </dev/null >/dev/null 2>&1; do sleep 2; done; exec ./openemr.sh"]
          env:
            # A Kubernetes volume starts empty, unlike a podman or Docker volume, which is filled from the image (the
            # M1 spike). Without the default site files, openemr.sh reads docker-version 0, tries an upgrade and
            # exits ("Cannot upgrade - OpenEMR is not configured yet"). Swarm mode makes this one replica the leader,
            # which restores sites/ from the image's /swarm-pieces when it is empty and leaves it alone afterwards.
            - {name: SWARM_MODE, value: "yes"}
            - {name: MYSQL_HOST, value: mariadb}
            - {name: MYSQL_ROOT_PASS, valueFrom: {secretKeyRef: {name: clinical-db, key: root}}}
            - {name: MYSQL_USER, value: openemr}
            - {name: MYSQL_PASS, valueFrom: {secretKeyRef: {name: clinical-db, key: openemr}}}
            - {name: OE_USER, value: admin}
            - {name: OE_PASS, valueFrom: {secretKeyRef: {name: clinical-db, key: admin}}}
          ports: [{containerPort: 80, name: http}]
          readinessProbe:
            httpGet: {path: /interface/login/login.php, port: 80}
            initialDelaySeconds: 30
            periodSeconds: 15
            failureThreshold: 40
          livenessProbe:
            httpGet: {path: /interface/login/login.php, port: 80}
            initialDelaySeconds: 600
            periodSeconds: 30
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [NET_RAW]}
          resources:
            requests: {memory: 384Mi, cpu: 100m}
            limits: {memory: 1280Mi}
          volumeMounts: [{name: sites, mountPath: /var/www/localhost/htdocs/openemr/sites}]
      volumes:
        - name: sites
          persistentVolumeClaim: {claimName: openemr-sites}
