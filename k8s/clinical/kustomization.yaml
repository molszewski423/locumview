# Non-secret resources: kubectl apply -k k8s/clinical (needs site.env, git-ignored; copy site.env.example).
# Secrets are applied separately, decrypted in memory: sops -d k8s/clinical/secrets/<name>.sops.yaml | kubectl apply -f -
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - networkpolicy.yaml
  - mariadb.yaml
  - openemr.yaml
  - gateway.yaml
  - ingress.yaml
  - sso.yaml
  - agent.yaml

# The images CI built and signed (.gitea/workflows/clinical-images.yml), by digest. Updated by a commit after each
# build that is to be deployed; verify first: scripts/clinical/verify-images.sh
images:
  - name: git.lan/mike/locumview-openemr
    # commit 609736e, clinical-images run 303 (patch 0003); signature and SBOM attestation verified by CI 2026-11-11
    digest: sha256:dbeeff6a8bf8a6caa801a0611f4b6ef029a6b434baa6c826cb7cc816194559d7
  - name: git.lan/mike/locumview-clinical-gateway
    # commit d2cc459, clinical-images run 296; signature and SBOM attestation verified by CI 2026-11-10
    digest: sha256:b7e7d84ca6eec6477f4f45286ba13cfd2f192c3b0c27a09064351c153bdf16c6
  - name: git.lan/mike/locumview-clinical-agent
    # commit 5427088, clinical-images (Gitea run 572); signature and SBOM attestation verified by CI 2026-11-12
    digest: sha256:58b784aa41d340ebe3048bbb8bb136580281cc2f6af37cc8b4de6beb985e47cc

# Site values (not secret, but site-specific): read from site.env by the replacements below and never applied.
configMapGenerator:
  - name: site-values
    envs: [site.env]
    options:
      disableNameSuffixHash: true
      annotations: {config.kubernetes.io/local-config: "true"}
replacements:
  - source: {kind: ConfigMap, name: site-values, fieldPath: data.CLINICAL_NODE}
    targets:
      - select: {kind: StatefulSet, name: mariadb}
        fieldPaths: ["spec.template.spec.nodeSelector.[kubernetes.io/hostname]"]
      - select: {kind: Deployment, name: openemr}
        fieldPaths: ["spec.template.spec.nodeSelector.[kubernetes.io/hostname]"]
      - select: {kind: Deployment, name: gateway}
        fieldPaths: ["spec.template.spec.nodeSelector.[kubernetes.io/hostname]"]
      - select: {kind: Deployment, name: oauth2-proxy}
        fieldPaths: ["spec.template.spec.nodeSelector.[kubernetes.io/hostname]"]
      - select: {kind: Deployment, name: agent}
        fieldPaths: ["spec.template.spec.nodeSelector.[kubernetes.io/hostname]"]
  - source: {kind: ConfigMap, name: site-values, fieldPath: data.SITE_TZ}
    targets:
      - select: {kind: ConfigMap, name: agent}
        fieldPaths: [data.SITE_TZ]
  - source: {kind: ConfigMap, name: site-values, fieldPath: data.OLLAMA_URL}
    targets:
      - select: {kind: ConfigMap, name: agent}
        fieldPaths: [data.OLLAMA_URL]
  - source: {kind: ConfigMap, name: site-values, fieldPath: data.OLLAMA_NAMESPACE}
    targets:
      - select: {kind: NetworkPolicy, name: agent}
        fieldPaths: ["spec.egress.0.to.0.namespaceSelector.matchLabels.[kubernetes.io/metadata.name]"]
  - source: {kind: ConfigMap, name: site-values, fieldPath: data.OLLAMA_APP}
    targets:
      - select: {kind: NetworkPolicy, name: agent}
        fieldPaths: [spec.egress.0.to.0.podSelector.matchLabels.app]
