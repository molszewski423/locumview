# Non-secret resources: kubectl apply -k k8s/clinical (needs site.env, git-ignored; copy site.env.example).
# Secrets are applied separately, decrypted in memory: sops -d k8s/clinical/secrets/<name>.sops.yaml | kubectl apply -f -
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - networkpolicy.yaml
  - mariadb.yaml
  - openemr.yaml
  - gateway.yaml
  - ingress.yaml
  - mtls.yaml
  - sso.yaml
  - agent.yaml
  - reset.yaml

# The images CI built and signed (.gitea/workflows/clinical-images.yml), by digest. Updated by a commit after each
# build that is to be deployed; verify first: scripts/clinical/verify-images.sh
images:
  - name: git.lan/mike/locumview-openemr
    # commit 813d005, clinical-images (Gitea run 854): patches 0001 to 0007 (0006: the SMART app dialog 1280 px wide; 0007:
    # asset version 8201, #191), the Automatic theme with the menu buttons; signature and SBOM attestation verified by CI
    # 2026-11-16
    digest: sha256:33c98a58298b7c124130be948fa2e63fe45f81a017cd38024c31a02b9a4a035b
  - name: git.lan/mike/locumview-clinical-gateway
    # commit 145bd5b, clinical-images (Gitea run 840): the app's duplicate anticoagulation label (#187); signature and
    # SBOM attestation verified by CI 2026-11-16
    digest: sha256:764c0310d779e8be21f7fcd2d64f835aab8e195db4cd91f0cc1709b96279c3eb
  - name: git.lan/mike/locumview-clinical-agent
    # commit 145bd5b, clinical-images (Gitea run 840): knowledge base 0.9.0 and the ADE module's duplicate
    # anticoagulation rule (#187); signature and SBOM attestation verified by CI 2026-11-16
    digest: sha256:38ebf229a966a9ff23aefb9022559b41d538ba7bfd0ae44203277b9119731c9e

# Site values (not secret, but site-specific): read from site.env by the replacements below and never applied.
configMapGenerator:
  - name: site-values
    envs: [site.env]
    options:
      disableNameSuffixHash: true
      annotations: {config.kubernetes.io/local-config: "true"}
replacements:
  - source: {kind: ConfigMap, name: site-values, fieldPath: data.CLINICAL_NODE}
    targets:
      - select: {kind: StatefulSet, name: mariadb}
        fieldPaths: ["spec.template.spec.nodeSelector.[kubernetes.io/hostname]"]
      - select: {kind: Deployment, name: openemr}
        fieldPaths: ["spec.template.spec.nodeSelector.[kubernetes.io/hostname]"]
      - select: {kind: Deployment, name: gateway}
        fieldPaths: ["spec.template.spec.nodeSelector.[kubernetes.io/hostname]"]
      - select: {kind: Deployment, name: oauth2-proxy}
        fieldPaths: ["spec.template.spec.nodeSelector.[kubernetes.io/hostname]"]
      - select: {kind: Deployment, name: agent}
        fieldPaths: ["spec.template.spec.nodeSelector.[kubernetes.io/hostname]"]
      - select: {kind: CronJob, name: openemr-baseline-save}
        fieldPaths: ["spec.jobTemplate.spec.template.spec.nodeSelector.[kubernetes.io/hostname]"]
      - select: {kind: CronJob, name: openemr-reset}
        fieldPaths: ["spec.jobTemplate.spec.template.spec.nodeSelector.[kubernetes.io/hostname]"]
  - source: {kind: ConfigMap, name: site-values, fieldPath: data.SITE_TZ}
    targets:
      - select: {kind: ConfigMap, name: agent}
        fieldPaths: [data.SITE_TZ]
      - select: {kind: CronJob, name: openemr-reset}
        fieldPaths: [spec.timeZone]
  - source: {kind: ConfigMap, name: site-values, fieldPath: data.OLLAMA_URL}
    targets:
      - select: {kind: ConfigMap, name: agent}
        fieldPaths: [data.OLLAMA_URL]
  - source: {kind: ConfigMap, name: site-values, fieldPath: data.OLLAMA_NAMESPACE}
    targets:
      - select: {kind: NetworkPolicy, name: agent}
        fieldPaths: ["spec.egress.0.to.0.namespaceSelector.matchLabels.[kubernetes.io/metadata.name]"]
  - source: {kind: ConfigMap, name: site-values, fieldPath: data.OLLAMA_APP}
    targets:
      - select: {kind: NetworkPolicy, name: agent}
        fieldPaths: [spec.egress.0.to.0.podSelector.matchLabels.app]

# ADR 0019: the desktop client sub-CA's public certificate, for Traefik's TLS option (mtls.yaml). Public, not SOPS.
secretGenerator:
  - name: desktop-client-ca
    namespace: clinical
    files: [ca.crt=desktop-client-ca.pem]
    type: Opaque
generatorOptions:
  disableNameSuffixHash: true
