# The agent service (clinical/images/agent/, signed by CI; the digest is set in kustomization.yaml): the Phase 9 lite
# rules over one patient's FHIR resources, which the gateway posts to it (clinical/agent/README.md). It holds no EHR
# credential and needs no Secret. Meets the restricted profile. Its network policy is here with it: only the gateway
# may reach it, and it may reach only the Ollama server's pods that explain findings (the cluster DNS rule in
# networkpolicy.yaml applies to every pod). Ollama's URL, namespace and app label are site values (site.env).
apiVersion: v1
kind: Service
metadata: {name: agent, namespace: clinical}
spec:
  selector: {app: agent}
  ports: [{name: http, port: 8080, targetPort: 8080}]
---
apiVersion: v1
kind: ConfigMap
metadata: {name: agent, namespace: clinical}
data:
  SITE_TZ: SITE_TZ   # set from site.env: the site's IANA time zone, for example America/New_York
  OLLAMA_URL: OLLAMA_URL   # set from site.env: the in-cluster Ollama Service, for finding explanations
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: agent, namespace: clinical}
spec:
  replicas: 1
  selector: {matchLabels: {app: agent}}
  template:
    metadata: {labels: {app: agent}}
    spec:
      nodeSelector: {kubernetes.io/hostname: CLINICAL_NODE}   # set from site.env
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: agent
          image: git.lan/mike/locumview-clinical-agent   # digest set in kustomization.yaml (images)
          envFrom: [{configMapRef: {name: agent}}]
          ports: [{containerPort: 8080, name: http}]
          readinessProbe:
            httpGet: {path: /healthz, port: 8080}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /healthz, port: 8080}
            periodSeconds: 30
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          resources:
            requests: {memory: 64Mi, cpu: 25m}
            limits: {memory: 192Mi}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: tmp
          emptyDir: {sizeLimit: 16Mi}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: agent, namespace: clinical}
spec:
  podSelector: {matchLabels: {app: agent}}
  policyTypes: [Ingress, Egress]
  ingress:
    - from: [{podSelector: {matchLabels: {app: gateway}}}]
      ports: [{protocol: TCP, port: 8080}]
  egress:
    # The Ollama server's pods (namespace and app label set from site.env), on the container port named "ollama".
    - to:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: OLLAMA_NAMESPACE}}
          podSelector: {matchLabels: {app: OLLAMA_APP}}
      ports: [{protocol: TCP, port: ollama}]
