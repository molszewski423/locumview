# Keycloak 26.8.0 (ADR 0005), production mode ("start") on plain HTTP inside the cluster.
# Hostname: https://login.locumview.com via the Cloudflare Tunnel; admin console only at http://127.0.0.1:8081.
apiVersion: v1
kind: Service
metadata:
  name: keycloak
  namespace: locumview
  labels: {app.kubernetes.io/name: keycloak, app.kubernetes.io/part-of: locumview}
spec:
  selector: {app.kubernetes.io/name: keycloak}
  ports: [{name: http, port: 8080, targetPort: http}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak
  namespace: locumview
  labels: {app.kubernetes.io/name: keycloak, app.kubernetes.io/part-of: locumview}
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: keycloak}
  template:
    metadata:
      labels: {app.kubernetes.io/name: keycloak, app.kubernetes.io/part-of: locumview}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 0
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: keycloak
          image: quay.io/keycloak/keycloak:26.8.0@sha256:b0f60d489d51c5d113390bdf5461d4c06e6051be026c05549f2e1e10ec352bcc
          args: ["start"]
          ports:
            - {name: http, containerPort: 8080}
            - {name: management, containerPort: 9000}
          env:
            - {name: KC_DB, value: postgres}
            - {name: KC_DB_URL_HOST, value: keycloak-db}
            - {name: KC_DB_URL_PORT, value: "5432"}
            - {name: KC_DB_URL_DATABASE, value: keycloak}
            - {name: KC_DB_USERNAME, value: keycloak}
            - name: KC_DB_PASSWORD
              valueFrom: {secretKeyRef: {name: keycloak, key: db-password}}
            # Public issuer through the Cloudflare Tunnel (ADR 0004); the admin console only on the operator
            # port-forward (its paths return 404 on the public hostname).
            - {name: KC_HOSTNAME, value: "https://login.locumview.com"}
            - {name: KC_HOSTNAME_ADMIN, value: "http://127.0.0.1:8081"}
            - {name: KC_PROXY_HEADERS, value: xforwarded}
            - {name: KC_HTTP_ENABLED, value: "true"}
            - {name: KC_HEALTH_ENABLED, value: "true"}
            # Extra trust anchors: IdM CA for LDAPS user federation (ADR 0006, changelog #34).
            - {name: KC_TRUSTSTORE_PATHS, value: /opt/keycloak/conf/truststores/idm-ca.pem}
            - {name: KC_METRICS_ENABLED, value: "false"}
            # Temporary master-realm admin, used only by configure-realm.sh and break-glass.
            - {name: KC_BOOTSTRAP_ADMIN_USERNAME, value: kc-bootstrap}
            - name: KC_BOOTSTRAP_ADMIN_PASSWORD
              valueFrom: {secretKeyRef: {name: keycloak, key: bootstrap-admin-password}}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          startupProbe:
            httpGet: {path: /health/started, port: management}
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet: {path: /health/ready, port: management}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /health/live, port: management}
            periodSeconds: 20
          resources: {requests: {cpu: 250m, memory: 768Mi}, limits: {memory: 1536Mi}}
          volumeMounts:
            - {name: theme-locumview, mountPath: /opt/keycloak/themes/locumview/login, readOnly: true}
            - {name: idm-ca, mountPath: /opt/keycloak/conf/truststores, readOnly: true}
      volumes:
        - name: idm-ca
          configMap: {name: keycloak-idm-ca}
        - name: theme-locumview
          configMap:
            name: keycloak-theme-locumview
            items:
              - {key: theme.properties, path: theme.properties}
              - {key: locumview.css, path: resources/css/locumview.css}
              - {key: locumview-wordmark.svg, path: resources/img/locumview-wordmark.svg}
              - {key: locumview-bg.jpg, path: resources/img/locumview-bg.jpg}
              - {key: favicon.ico, path: resources/img/favicon.ico}
