# Guacamole web application 1.6.0 (Tomcat), PostgreSQL auth + OpenID Connect (Keycloak). Not exposed: reach it with
# `kubectl -n locumview port-forward svc/guacamole 8080:8080` until Keycloak + MFA are in front (ADR 0004).
apiVersion: v1
kind: Service
metadata:
  name: guacamole
  namespace: locumview
  labels: {app.kubernetes.io/name: guacamole, app.kubernetes.io/part-of: locumview}
spec:
  selector: {app.kubernetes.io/name: guacamole}
  ports: [{name: http, port: 8080, targetPort: http}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: guacamole
  namespace: locumview
  labels: {app.kubernetes.io/name: guacamole, app.kubernetes.io/part-of: locumview}
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: guacamole}
  template:
    metadata:
      labels: {app.kubernetes.io/name: guacamole, app.kubernetes.io/part-of: locumview}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: guacamole
          image: docker.io/guacamole/guacamole:1.6.0@sha256:f344085e618bb05e22b964b0208dbd06d3468275bac70206f93805245e067b40
          ports: [{name: http, containerPort: 8080}]
          env:
            - {name: GUACD_HOSTNAME, value: guacd}
            - {name: GUACD_PORT, value: "4822"}
            - {name: POSTGRESQL_HOSTNAME, value: guacamole-db}
            - {name: POSTGRESQL_DATABASE, value: guacamole}
            - {name: POSTGRESQL_USERNAME, value: guacamole_app}
            - name: POSTGRESQL_PASSWORD
              valueFrom: {secretKeyRef: {name: guacamole-db, key: app-password}}
            - {name: WEBAPP_CONTEXT, value: ROOT}
            # Template GUACAMOLE_HOME: the image links extensions/* from here (LocumView branding).
            - {name: GUACAMOLE_HOME, value: /etc/guacamole-home}
            # SSO accounts get a DB record (login history/audit); permissions come from the groups claim.
            - {name: POSTGRESQL_AUTO_CREATE_ACCOUNTS, value: "true"}
            # OpenID Connect to Keycloak (ADR 0005). Implicit flow only in Guacamole 1.6.0.
            # Browser-facing URLs via the Cloudflare Tunnel (ADR 0004); JWKS fetched in-cluster.
            - {name: OPENID_AUTHORIZATION_ENDPOINT, value: "https://login.locumview.com/realms/locumview/protocol/openid-connect/auth"}
            - {name: OPENID_ISSUER, value: "https://login.locumview.com/realms/locumview"}
            - {name: OPENID_JWKS_ENDPOINT, value: "http://keycloak:8080/realms/locumview/protocol/openid-connect/certs"}
            - {name: OPENID_CLIENT_ID, value: guacamole}
            - {name: OPENID_REDIRECT_URI, value: "https://login.locumview.com/"}
            - {name: OPENID_SCOPE, value: "openid profile email"}
            - {name: OPENID_USERNAME_CLAIM_TYPE, value: preferred_username}
            - {name: OPENID_GROUPS_CLAIM_TYPE, value: groups}
            - {name: OPENID_MAX_TOKEN_VALIDITY, value: "5"}
            # Guacamole sessions end after 30 minutes idle, matching Keycloak's SSO idle timeout (configure-realm.sh).
            # Guacamole never expires a session while a desktop connection is open (HashTokenSessionMap, 1.6.0).
            - {name: API_SESSION_TIMEOUT, value: "30"}
            # SSO first: visitors go straight to Keycloak. The local break-glass account is disabled by default
            # (k8s/locumview/guacamole/break-glass.sh). Branding last so its translations win.
            - {name: EXTENSION_PRIORITY, value: "openid, *, locumview-branding"}
            # Real client IPs in Guacamole's audit log: trust X-Forwarded-For from in-cluster proxies (cloudflared).
            - {name: REMOTE_IP_VALVE_ENABLED, value: "true"}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          readinessProbe:
            httpGet: {path: /, port: http}
            initialDelaySeconds: 20
            periodSeconds: 10
          resources: {requests: {cpu: 100m, memory: 384Mi}, limits: {memory: 1Gi}}
          volumeMounts:
            - {name: branding, mountPath: /etc/guacamole-home/extensions, readOnly: true}
      volumes:
        - name: branding
          configMap:
            name: guacamole-branding
            items: [{key: locumview-branding.jar, path: locumview-branding.jar}]
