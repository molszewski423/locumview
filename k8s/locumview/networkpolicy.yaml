# Default deny in both directions, then only the flows the access layer needs (changelog #17).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: default-deny, namespace: locumview}
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: allow-dns, namespace: locumview}
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: kube-system}}
          podSelector: {matchLabels: {k8s-app: kube-dns}}
      ports: [{protocol: UDP, port: 53}, {protocol: TCP, port: 53}]
---
# Guacamole web: talks to its database, guacd, and Keycloak (JWKS) only.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: guacamole, namespace: locumview}
spec:
  podSelector: {matchLabels: {app.kubernetes.io/name: guacamole}}
  policyTypes: [Egress]
  egress:
    - to: [{podSelector: {matchLabels: {app.kubernetes.io/name: guacamole-db}}}]
      ports: [{protocol: TCP, port: 5432}]
    - to: [{podSelector: {matchLabels: {app.kubernetes.io/name: guacd}}}]
      ports: [{protocol: TCP, port: 4822}]
    - to: [{podSelector: {matchLabels: {app.kubernetes.io/name: keycloak}}}]
      ports: [{protocol: TCP, port: 8080}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: guacamole-db, namespace: locumview}
spec:
  podSelector: {matchLabels: {app.kubernetes.io/name: guacamole-db}}
  policyTypes: [Ingress]
  ingress:
    - from: [{podSelector: {matchLabels: {app.kubernetes.io/name: guacamole}}}]
      ports: [{protocol: TCP, port: 5432}]
---
# guacd: accepts the Guacamole protocol from the web app only; may open RDP to the desktops only.
# Desktops by address until Phase 3 provisions them; 192.168.4.36 = locumview-ref-dev (changelog #15):
# 3390 = user-mode GRD (users, straight to desktop), 3389 = system-mode GRD/GDM (admin fallback). Changelog #19.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: guacd, namespace: locumview}
spec:
  podSelector: {matchLabels: {app.kubernetes.io/name: guacd}}
  policyTypes: [Ingress, Egress]
  ingress:
    - from: [{podSelector: {matchLabels: {app.kubernetes.io/name: guacamole}}}]
      ports: [{protocol: TCP, port: 4822}]
  egress:
    - to: [{ipBlock: {cidr: 192.168.4.36/32}}]
      ports: [{protocol: TCP, port: 3389}, {protocol: TCP, port: 3390}]
---
# Keycloak: serves Guacamole's server-side JWKS fetch (browsers reach it via port-forward now, the tunnel later).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: keycloak, namespace: locumview}
spec:
  podSelector: {matchLabels: {app.kubernetes.io/name: keycloak}}
  policyTypes: [Ingress, Egress]
  ingress:
    - from: [{podSelector: {matchLabels: {app.kubernetes.io/name: guacamole}}}]
      ports: [{protocol: TCP, port: 8080}]
    # Infinispan/JGroups between Keycloak instances (rolling updates; HA later): 7800 data, 57800 failure detection.
    - from: [{podSelector: {matchLabels: {app.kubernetes.io/name: keycloak}}}]
      ports: [{protocol: TCP, port: 7800}, {protocol: TCP, port: 57800}]
  egress:
    - to: [{podSelector: {matchLabels: {app.kubernetes.io/name: keycloak-db}}}]
      ports: [{protocol: TCP, port: 5432}]
    - to: [{podSelector: {matchLabels: {app.kubernetes.io/name: keycloak}}}]
      ports: [{protocol: TCP, port: 7800}, {protocol: TCP, port: 57800}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: keycloak-db, namespace: locumview}
spec:
  podSelector: {matchLabels: {app.kubernetes.io/name: keycloak-db}}
  policyTypes: [Ingress]
  ingress:
    - from: [{podSelector: {matchLabels: {app.kubernetes.io/name: keycloak}}}]
      ports: [{protocol: TCP, port: 5432}]
