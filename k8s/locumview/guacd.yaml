# guacd 1.6.0: the RDP client side of Guacamole (bundles FreeRDP 2.11.7, see changelog #17).
apiVersion: v1
kind: Service
metadata:
  name: guacd
  namespace: locumview
  labels: {app.kubernetes.io/name: guacd, app.kubernetes.io/part-of: locumview}
spec:
  selector: {app.kubernetes.io/name: guacd}
  ports: [{name: guacd, port: 4822, targetPort: guacd}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: guacd
  namespace: locumview
  labels: {app.kubernetes.io/name: guacd, app.kubernetes.io/part-of: locumview}
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: guacd}
  template:
    metadata:
      labels: {app.kubernetes.io/name: guacd, app.kubernetes.io/part-of: locumview}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: guacd
          image: docker.io/guacamole/guacd:1.6.0@sha256:8974eaa9ba32f713daf311e7cc8cd7e4cdfba1edea39eed75524e78ef4b08f4f
          ports: [{name: guacd, containerPort: 4822}]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          readinessProbe:
            tcpSocket: {port: guacd}
            periodSeconds: 10
          resources: {requests: {cpu: 50m, memory: 128Mi}, limits: {memory: 1Gi}}
