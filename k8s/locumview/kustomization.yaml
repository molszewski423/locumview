# Non-secret resources: kubectl apply -k k8s/locumview
# Secrets are applied separately, decrypted in memory: sops -d k8s/locumview/secrets/<name>.sops.yaml | kubectl apply -f -
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - networkpolicy.yaml
  - postgres.yaml
  - guacd.yaml
  - guacamole.yaml
  - guacamole-history-cleanup.yaml
  - keycloak-db.yaml
  - keycloak.yaml
  - cloudflared.yaml

# Keycloak login theme (keycloak/theme/*), mounted at /opt/keycloak/themes/locumview/login. The generated name
# carries a content hash, so any theme change rolls Keycloak (themes are cached in production mode).
configMapGenerator:
  # IdM CA certificate (public), trusted by Keycloak for LDAPS to idm01 (ADR 0006, changelog #34).
  - name: keycloak-idm-ca
    namespace: locumview
    files:
      - keycloak/idm-ca.pem
  - name: keycloak-theme-locumview
    namespace: locumview
    files:
      - keycloak/theme/theme.properties
      - keycloak/theme/locumview.css
      - keycloak/theme/locumview-wordmark.svg
      - keycloak/theme/locumview-bg.jpg
      - keycloak/theme/favicon.ico
  # Guacamole branding extension (built reproducibly by packaging/guacamole-branding/build.py).
  - name: guacamole-branding
    namespace: locumview
    files:
      - guacamole/locumview-branding.jar

# Site-specific values (addresses, node names) are not in git: copy site.env.example to site.env (git-ignored) and
# fill it in. Without it, `kubectl apply -k` fails instead of applying placeholders. The ConfigMap only feeds the
# replacements below and is never applied (local-config).
  - name: site-values
    envs: [site.env]
    options:
      disableNameSuffixHash: true
      annotations: {config.kubernetes.io/local-config: "true"}
replacements:
  - source: {kind: ConfigMap, name: site-values, fieldPath: data.REFDEV_CIDR}
    targets: [{select: {kind: NetworkPolicy, name: guacd}, fieldPaths: [spec.egress.0.to.0.ipBlock.cidr]}]
  - source: {kind: ConfigMap, name: site-values, fieldPath: data.IDM_CIDR}
    targets: [{select: {kind: NetworkPolicy, name: keycloak}, fieldPaths: [spec.egress.2.to.0.ipBlock.cidr]}]
  - source: {kind: ConfigMap, name: site-values, fieldPath: data.DB_NODE}
    targets:
      - select: {kind: StatefulSet, name: guacamole-db}
        fieldPaths:
          - "spec.template.spec.nodeSelector.[kubernetes.io/hostname]"
      - select: {kind: StatefulSet, name: keycloak-db}
        fieldPaths:
          - "spec.template.spec.nodeSelector.[kubernetes.io/hostname]"
