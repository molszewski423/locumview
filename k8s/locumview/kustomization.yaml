# Non-secret resources: kubectl apply -k k8s/locumview
# Secrets are applied separately, decrypted in memory: sops -d k8s/locumview/secrets/<name>.sops.yaml | kubectl apply -f -
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - networkpolicy.yaml
  - postgres.yaml
  - guacd.yaml
  - guacamole.yaml
  - guacamole-history-cleanup.yaml
  - keycloak-db.yaml
  - keycloak.yaml
  - cloudflared.yaml

# Keycloak login theme (keycloak/theme/*), mounted at /opt/keycloak/themes/locumview/login. The generated name
# carries a content hash, so any theme change rolls Keycloak (themes are cached in production mode).
configMapGenerator:
  # IdM CA certificate (public), trusted by Keycloak for LDAPS to idm01 (ADR 0006, changelog #34).
  - name: keycloak-idm-ca
    namespace: locumview
    files:
      - keycloak/idm-ca.pem
  - name: keycloak-theme-locumview
    namespace: locumview
    files:
      - keycloak/theme/theme.properties
      - keycloak/theme/locumview.css
      - keycloak/theme/locumview-wordmark.svg
      - keycloak/theme/locumview-bg.jpg
      - keycloak/theme/favicon.ico
  # Guacamole branding extension (built reproducibly by packaging/guacamole-branding/build.py).
  - name: guacamole-branding
    namespace: locumview
    files:
      - guacamole/locumview-branding.jar
