# Cloudflare Tunnel connector for the "locumview" tunnel (ADR 0004). Outbound-only; routes are defined in
# Cloudflare: login.locumview.com /realms/locumview + /resources -> keycloak:8080, everything else -> guacamole:8080.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudflared
  namespace: locumview
  labels: {app.kubernetes.io/name: cloudflared, app.kubernetes.io/part-of: locumview}
spec:
  replicas: 2
  selector:
    matchLabels: {app.kubernetes.io/name: cloudflared}
  template:
    metadata:
      labels: {app.kubernetes.io/name: cloudflared, app.kubernetes.io/part-of: locumview}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile: {type: RuntimeDefault}
      # Spread the two connectors over nodes so one node going down doesn't take the site down.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector: {matchLabels: {app.kubernetes.io/name: cloudflared}}
      containers:
        - name: cloudflared
          image: docker.io/cloudflare/cloudflared:2026.9.3@sha256:072c067d25ccbe61d46e18f0d0723255f2bb5304f7317caa95b27031520ff92c
          args: ["tunnel", "--no-autoupdate", "--metrics", "0.0.0.0:2000", "run"]
          env:
            - name: TUNNEL_TOKEN
              valueFrom: {secretKeyRef: {name: cloudflared, key: token}}
          ports: [{name: metrics, containerPort: 2000}]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          readinessProbe:
            httpGet: {path: /ready, port: metrics}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /ready, port: metrics}
            initialDelaySeconds: 30
            periodSeconds: 20
            failureThreshold: 5
          resources: {requests: {cpu: 20m, memory: 64Mi}, limits: {memory: 256Mi}}
