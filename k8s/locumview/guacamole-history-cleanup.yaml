# Deletes Guacamole login and connection history (username, client IP, times) older than 90 days, as the
# locumview.com privacy policy states. Keycloak's own events expire after 90 days via realm settings
# (keycloak/configure-realm.sh). Runs as the least-privilege guacamole_app role (DML only, no DDL).
apiVersion: batch/v1
kind: CronJob
metadata:
  name: guacamole-history-cleanup
  namespace: locumview
  labels: {app.kubernetes.io/name: guacamole-history-cleanup, app.kubernetes.io/part-of: locumview}
spec:
  schedule: "17 3 * * *"
  timeZone: America/New_York
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      ttlSecondsAfterFinished: 604800
      template:
        metadata:
          labels: {app.kubernetes.io/name: guacamole-history-cleanup, app.kubernetes.io/part-of: locumview}
        spec:
          restartPolicy: OnFailure
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 999
            runAsGroup: 999
            seccompProfile: {type: RuntimeDefault}
          containers:
            - name: cleanup
              image: docker.io/library/postgres:17.11-trixie@sha256:d74eeac9a635390a49bc21bd49fccd973de707e2a53a76ac49b552b8712ec46f
              env:
                - {name: PGHOST, value: guacamole-db}
                - {name: PGDATABASE, value: guacamole}
                - {name: PGUSER, value: guacamole_app}
                - name: PGPASSWORD
                  valueFrom: {secretKeyRef: {name: guacamole-db, key: app-password}}
              command:
                - psql
                - -v
                - ON_ERROR_STOP=1
                - -c
                - >-
                  WITH c AS (DELETE FROM guacamole_connection_history WHERE start_date < now() - interval '90 days' RETURNING 1),
                  u AS (DELETE FROM guacamole_user_history WHERE start_date < now() - interval '90 days' RETURNING 1)
                  SELECT (SELECT count(*) FROM c) AS connection_history_deleted, (SELECT count(*) FROM u) AS user_history_deleted;
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities: {drop: [ALL]}
              resources: {requests: {cpu: 10m, memory: 32Mi}, limits: {memory: 128Mi}}
