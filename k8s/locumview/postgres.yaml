# Guacamole's database (PostgreSQL 17). Single replica on local-path storage, pinned to mikepc
# (local-path volumes are node-bound; mikepc has the most headroom). See changelog #17.
apiVersion: v1
kind: ConfigMap
metadata:
  name: guacamole-db-init
  namespace: locumview
data:
  # Runs once, on an empty data directory (postgres image initdb hook), after 001-schema.sql.
  # - Least-privilege app role for Guacamole (no DDL, no superuser).
  # - Replaces the schema's well-known guacadmin/guacadmin with a break-glass admin "locumadmin"
  #   whose password comes from the SOPS secret. Hash format per Guacamole: SHA-256(password || HEX(salt)).
  002-roles-and-admin.sh: |
    #!/bin/bash
    set -euo pipefail
    salt=$(head -c 32 /dev/urandom | od -An -tx1 | tr -d ' \n' | tr 'a-f' 'A-F')
    psql -v ON_ERROR_STOP=1 -U "$POSTGRES_USER" -d "$POSTGRES_DB" \
      -v app_pw="$GUAC_DB_PASSWORD" -v admin_pw="$GUAC_ADMIN_PASSWORD" -v salt="$salt" <<'SQL'
    CREATE ROLE guacamole_app LOGIN PASSWORD :'app_pw';
    GRANT CONNECT ON DATABASE guacamole TO guacamole_app;
    GRANT USAGE ON SCHEMA public TO guacamole_app;
    GRANT SELECT, INSERT, UPDATE, DELETE ON ALL TABLES IN SCHEMA public TO guacamole_app;
    GRANT SELECT, USAGE ON ALL SEQUENCES IN SCHEMA public TO guacamole_app;
    UPDATE guacamole_entity SET name = 'locumadmin' WHERE name = 'guacadmin' AND type = 'USER';
    UPDATE guacamole_user u
       SET (password_salt, password_hash, password_date) =
           (decode(:'salt', 'hex'), sha256(convert_to(:'admin_pw' || :'salt', 'UTF8')), CURRENT_TIMESTAMP)
      FROM guacamole_entity e
     WHERE u.entity_id = e.entity_id AND e.name = 'locumadmin' AND e.type = 'USER';
    SQL
---
apiVersion: v1
kind: Service
metadata:
  name: guacamole-db
  namespace: locumview
  labels: {app.kubernetes.io/name: guacamole-db, app.kubernetes.io/part-of: locumview}
spec:
  selector: {app.kubernetes.io/name: guacamole-db}
  ports: [{name: postgres, port: 5432, targetPort: postgres}]
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: guacamole-db
  namespace: locumview
  labels: {app.kubernetes.io/name: guacamole-db, app.kubernetes.io/part-of: locumview}
spec:
  serviceName: guacamole-db
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: guacamole-db}
  template:
    metadata:
      labels: {app.kubernetes.io/name: guacamole-db, app.kubernetes.io/part-of: locumview}
    spec:
      nodeSelector: {kubernetes.io/hostname: mikepc}
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile: {type: RuntimeDefault}
      initContainers:
        # Schema SQL generated by the same Guacamole image version that will use it.
        - name: guacamole-schema
          image: docker.io/guacamole/guacamole:1.6.0@sha256:f344085e618bb05e22b964b0208dbd06d3468275bac70206f93805245e067b40
          command: ["/bin/sh", "-c", "/opt/guacamole/bin/initdb.sh --postgresql > /initdb/001-schema.sql && cp /init-scripts/*.sh /initdb/"]
          securityContext: &restricted
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: initdb, mountPath: /initdb}
            - {name: init-scripts, mountPath: /init-scripts}
          resources: {requests: {cpu: 10m, memory: 64Mi}, limits: {memory: 256Mi}}
      containers:
        - name: postgres
          image: docker.io/library/postgres:17.11-trixie@sha256:d74eeac9a635390a49bc21bd49fccd973de707e2a53a76ac49b552b8712ec46f
          ports: [{name: postgres, containerPort: 5432}]
          env:
            - {name: POSTGRES_DB, value: guacamole}
            - {name: POSTGRES_USER, value: postgres}
            - {name: PGDATA, value: /var/lib/postgresql/data/pgdata}
            - name: POSTGRES_PASSWORD
              valueFrom: {secretKeyRef: {name: guacamole-db, key: postgres-password}}
            - name: GUAC_DB_PASSWORD
              valueFrom: {secretKeyRef: {name: guacamole-db, key: app-password}}
            - name: GUAC_ADMIN_PASSWORD
              valueFrom: {secretKeyRef: {name: guacamole-db, key: admin-password}}
          securityContext: *restricted
          readinessProbe:
            exec: {command: ["pg_isready", "-U", "postgres", "-d", "guacamole"]}
            periodSeconds: 10
          volumeMounts:
            - {name: data, mountPath: /var/lib/postgresql/data}
            - {name: initdb, mountPath: /docker-entrypoint-initdb.d}
            - {name: run, mountPath: /var/run/postgresql}
          resources: {requests: {cpu: 50m, memory: 128Mi}, limits: {memory: 512Mi}}
      volumes:
        - {name: initdb, emptyDir: {}}
        - {name: run, emptyDir: {}}
        - name: init-scripts
          configMap: {name: guacamole-db-init, defaultMode: 0555}
  volumeClaimTemplates:
    - metadata: {name: data}
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: local-path
        resources: {requests: {storage: 2Gi}}
