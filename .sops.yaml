# Recipients: age public keys only. Private keys live outside the repo (~/.config/sops/age/keys.txt, mode 600,
# with an offline backup). After adding or removing a recipient, run `sops updatekeys` on every *.sops.yaml.
creation_rules:
  - path_regex: k8s/.*\.sops\.ya?ml$
    encrypted_regex: ^(data|stringData)$
