# LocumView's reference deployment (Phase 9 lite, M3 step 5): the EHR launcher opens the clinical OpenEMR. Installed
# over the locumview-ehr-launcher RPM's generic default by the image's Containerfile (step 3c); other deployments
# set their own EHR here (ADR 0016). Since ADR 0019 the names accept LocumView desktops only (client certificate).
EHR_URL=https://emr.corp.locumview.com/
# The EHR's names, also the only LAN addresses the demo user may reach (demo-egress-ehr, changelog #165).
EHR_HOSTS="emr.corp.locumview.com clinical.corp.locumview.com"
