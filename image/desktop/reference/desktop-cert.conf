# LocumView reference deployment: desktop client certificates from the IdM sub-CA of ADR 0019 build step 2.
SUBCA=locumview-desktop-clients
PROFILE=locumviewDesktopClient
# Renew once fewer hours than this remain; alert when fewer than ALERT_BEFORE_HOURS remain and renewal failed.
RENEW_BEFORE_HOURS=48
ALERT_BEFORE_HOURS=24
