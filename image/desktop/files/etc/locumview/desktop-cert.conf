# LocumView desktop client certificates (ADR 0019). Off until a deployment names its IdM sub-CA and profile:
# the reference deployment sets them in the image (image/desktop/reference/desktop-cert.conf).
SUBCA=
PROFILE=
# Renew once fewer hours than this remain; alert when fewer than ALERT_BEFORE_HOURS remain and renewal failed.
RENEW_BEFORE_HOURS=48
ALERT_BEFORE_HOURS=24
