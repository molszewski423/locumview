# The EHR browser slot (ADR 0016, image/desktop/README.md "Default apps"): the address the EHR launcher opens in
# Google Chrome. Set it to the organization's EHR, and allow the EHR's sites in
# /etc/opt/chrome/policies/managed/50-locumview-ehr-sites.json (URLAllowlist); Chrome opens nothing else.
EHR_URL=file:///usr/share/locumview/ehr/index.html
