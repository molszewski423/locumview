# cloud-init carries only the per-desktop values for first boot (image/desktop/provision/). NoCloud seed only, so
# the same image works on libvirt, Proxmox and KubeVirt; no default user, and sshd and root are left to the image.
datasource_list: [NoCloud, None]
users: []
disable_root: true
ssh_deletekeys: false
preserve_hostname: false
