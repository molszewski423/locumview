# Keep the vendor timer and its schedule, but never ask bootc to reboot from a background job.
# First-boot provisioning establishes the image reference and signature policy before this job may run.
[Unit]
Description=LocumView: stage image updates for the next operator-planned reboot
After=locumview-provision.service
ConditionPathExists=/var/lib/locumview/provisioned

[Service]
ExecStart=
ExecStart=/usr/bin/bootc upgrade
