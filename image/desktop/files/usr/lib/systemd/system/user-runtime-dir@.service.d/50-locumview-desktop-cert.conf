# ADR 0019: a desktop user may use the TPM (/dev/tpmrm0) while signed in, for their own token's key; the helper
# then makes sure their client certificate is current. "-": a failure here never blocks a sign-in.
[Service]
ExecStartPost=-/usr/libexec/locumview/desktop-cert login %i
ExecStopPost=-/usr/libexec/locumview/desktop-cert logout %i
