# Firefox's enterprise policies for the Flatpak (hardening/browser/README.md): the Flatpak reads them from its
# org.mozilla.firefox.systemconfig extension, which a system installation can provide as a directory under
# /var/lib/flatpak/extension; it is a link to /etc/firefox, so /etc/firefox/policies/policies.json applies.
# Modes are set explicitly: the STIG umask would make the directories unreadable to the sandbox.
d /var/lib/flatpak/extension 0755 root root -
d /var/lib/flatpak/extension/org.mozilla.firefox.systemconfig 0755 root root -
d /var/lib/flatpak/extension/org.mozilla.firefox.systemconfig/x86_64 0755 root root -
L+ /var/lib/flatpak/extension/org.mozilla.firefox.systemconfig/x86_64/stable - - - - /etc/firefox
