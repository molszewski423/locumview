# pam_faillock's records (DISA STIG account_password_selinux_faillock_dir): created at boot by systemd-tmpfiles,
# which applies the SELinux file context (faillog_t). Created by pam_faillock itself at the first failed login,
# the directory gets the generic var_log_t of the separate /var/log file system instead.
d /var/log/faillock 0755 root root -
