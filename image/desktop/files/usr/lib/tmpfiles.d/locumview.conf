# pam_faillock's records (DISA STIG account_password_selinux_faillock_dir): created at boot by systemd-tmpfiles,
# which applies the SELinux file context (faillog_t). Created by pam_faillock itself at the first failed login,
# the directory gets the generic var_log_t of the separate /var/log file system instead.
d /var/log/faillock 0755 root root -
# Package directories under /var that the image ships but bootc does not create on an installed system (/var is
# not updated from the image), and that have no tmpfiles.d entry of their own. IdM enrollment needs them (lv-test01).
d /var/lib/ipa-client             0755 root root -
d /var/lib/ipa-client/pki         0755 root root -
d /var/lib/ipa-client/sysrestore  0755 root root -
d /var/lib/certmonger             0755 root root -
d /var/lib/certmonger/cas         0700 root root -
d /var/lib/certmonger/local       0700 root root -
d /var/lib/certmonger/requests    0700 root root -
