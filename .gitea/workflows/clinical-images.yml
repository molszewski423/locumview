# Build, push, sign and attest the Phase 9 lite clinical images (k8s/clinical/): OpenEMR with LocumView's fixes, and
# the clinical app with its gateway. The same runner, key and formats as the desktop image (image.yml): signatures and
# SBOM attestations in cosign's classic format, signed offline with the project key; verify with
#   cosign verify --key image/desktop/signing/cosign.pub --insecure-ignore-tlog git.lan/mike/<image>@<digest>
# Each build is pushed as :<commit> and :testing. A deployment pins a digest in k8s/clinical/kustomization.yaml.
# Secrets (Actions): REGISTRY_TOKEN (Gitea token, package scope), COSIGN_PRIVATE_KEY / COSIGN_PASSWORD.
name: clinical-images
"on":
  push:
    branches: [main]
    paths:
      - clinical/images/**
      - clinical/app/**
      - clinical/spike/patches/**
      - .gitea/workflows/clinical-images.yml
  workflow_dispatch:

jobs:
  build:
    runs-on: image-builder
    timeout-minutes: 45
    strategy:
      max-parallel: 1
      matrix:
        include:
          - {name: locumview-openemr, containerfile: clinical/images/openemr/Containerfile}
          - {name: locumview-clinical-gateway, containerfile: clinical/images/gateway/Containerfile}
    concurrency:
      group: clinical-image-${{ matrix.name }}
      cancel-in-progress: false
    env:
      IMAGE: git.lan/mike/${{ matrix.name }}
    steps:
      - name: Check out
        env:
          TOKEN: ${{ gitea.token }}
        run: |
          set -euo pipefail
          rm -rf src
          git clone -q "https://x-access-token:${TOKEN}@git.lan/${GITHUB_REPOSITORY}.git" src
          git -C src remote set-url origin "https://git.lan/${GITHUB_REPOSITORY}.git"
          git -C src checkout -q "$GITHUB_SHA"
          git -C src log -1 --format='%h %s'
          install -d -m 0700 "$PWD/.job"
          echo "JOB=$PWD/.job" >> "$GITHUB_ENV"
          echo "TAG=${GITHUB_SHA:0:12}" >> "$GITHUB_ENV"

      - name: Registry login
        env:
          REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
        run: |
          set -euo pipefail
          A="$JOB/auth.json"; printf '{"auths":{}}' > "$A"; chmod 600 "$A"
          printf '%s' "$REGISTRY_TOKEN" | podman login --authfile "$A" --username "${GITHUB_REPOSITORY_OWNER}" --password-stdin git.lan
          install -d -m 0700 "$JOB/docker"; ln -sf "$A" "$JOB/docker/config.json"

      - name: Build
        run: |
          set -euo pipefail
          cd src
          podman build --authfile "$JOB/auth.json" -f "${{ matrix.containerfile }}" \
            --label org.opencontainers.image.revision="$GITHUB_SHA" \
            --label org.opencontainers.image.source="https://git.lan/${GITHUB_REPOSITORY}" \
            -t "$IMAGE:$TAG" .

      - name: Push
        run: |
          set -euo pipefail
          podman push --retry 3 --authfile "$JOB/auth.json" --digestfile "$JOB/digest" "$IMAGE:$TAG"
          podman push --retry 3 --authfile "$JOB/auth.json" "$IMAGE:$TAG" "docker://$IMAGE:testing"
          echo "DIGEST=$(cat "$JOB/digest")" >> "$GITHUB_ENV"
          echo "pushed $IMAGE:$TAG as $(cat "$JOB/digest")"

      - name: Sign
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
        run: |
          set -euo pipefail
          export DOCKER_CONFIG="$JOB/docker"
          cosign sign --key env://COSIGN_PRIVATE_KEY --new-bundle-format=false --use-signing-config=false --tlog-upload=false -y \
            -a "git.commit=$GITHUB_SHA" -a "ci.run=$GITHUB_RUN_NUMBER" "$IMAGE@$DIGEST"

      - name: SBOM
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
        run: |
          set -euo pipefail
          export DOCKER_CONFIG="$JOB/docker"
          syft scan "registry:$IMAGE@$DIGEST" -q -o "spdx-json=$JOB/sbom-full.spdx.json"
          # Packages only, as for the desktop image (image.yml): packages and their relationships are what
          # vulnerability tracking uses.
          python3 -I - "$JOB/sbom-full.spdx.json" "$JOB/sbom.spdx.json" <<'PY'
          import json, sys
          d = json.load(open(sys.argv[1]))
          files = {f["SPDXID"] for f in d.pop("files", [])}
          for p in d["packages"]:
              p.pop("hasFiles", None)
          d["relationships"] = [r for r in d.get("relationships", [])
                                if r["spdxElementId"] not in files and r["relatedSpdxElement"] not in files]
          json.dump(d, open(sys.argv[2], "w"), separators=(",", ":"))
          print(len(d["packages"]), "packages in the SBOM")
          PY
          cosign attest --key env://COSIGN_PRIVATE_KEY --new-bundle-format=false --use-signing-config=false --tlog-upload=false -y \
            --type spdxjson --predicate "$JOB/sbom.spdx.json" "$IMAGE@$DIGEST"

      - name: Verify
        run: |
          set -euo pipefail
          export DOCKER_CONFIG="$JOB/docker"
          cosign verify --key src/image/desktop/signing/cosign.pub --insecure-ignore-tlog "$IMAGE@$DIGEST" >/dev/null
          cosign verify-attestation --key src/image/desktop/signing/cosign.pub --insecure-ignore-tlog --type spdxjson \
            "$IMAGE@$DIGEST" >/dev/null
          echo "verified: signature and SBOM attestation for $IMAGE@$DIGEST ($IMAGE:$TAG, also :testing)"
          echo "to deploy, pin this digest in k8s/clinical/kustomization.yaml: $DIGEST"

      - name: Clean up
        if: always()
        run: |
          set -uo pipefail
          [ -n "${JOB:-}" ] && find "$JOB" -type f -exec shred -u {} + 2>/dev/null; rm -rf "${JOB:-/nonexistent}" src
          podman images --format '{{.ID}} {{.Repository}}' | awk -v r="$IMAGE" '$2==r {print $1}' | tail -n +3 | xargs -r podman rmi -f >/dev/null 2>&1 || true
          podman image prune -f >/dev/null 2>&1 || true
