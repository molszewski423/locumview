# Build, push, sign and attest the desktop image (version-one item 1, ADR 0007).
#
# Runs on the image-build runner on node2 (label image-builder): a host-mode act_runner as an unprivileged user with
# rootless podman, registered to this repository only. The cluster runner gives jobs no container engine on purpose,
# and a bootc image build needs one. Credentials come from Actions secrets (each also kept in SOPS):
#   REDHAT_REGISTRY_USER / REDHAT_REGISTRY_PASSWORD   pull the RHEL bootc base image
#   RHSM_ORG / RHSM_ACTIVATION_KEY                    dnf during the build (build secret, never in a layer)
#   REGISTRY_TOKEN                                    push to git.lan (Gitea token, package scope only)
#   COSIGN_PRIVATE_KEY / COSIGN_PASSWORD              sign (public key: image/desktop/signing/cosign.pub)
# Signatures and attestations use cosign's classic format (sha256-<digest>.sig and .att tags): RHEL's
# containers/image, which bootc uses, does not read cosign 3's new bundle format. Signing is offline (no public
# transparency log): verify with
#   cosign verify --key image/desktop/signing/cosign.pub --insecure-ignore-tlog git.lan/mike/locumview-desktop@<digest>
# Each build is pushed as :<commit> and :testing, with three things attached to its digest: the signature, the SBOM
# and the image STIG scan (hardening/stig/scan-image.sh). Desktops follow :stable, which only promote.yml moves,
# after checking all three (changelog #62).
name: image
"on":
  push:
    branches: [main]
    paths:
      - LICENSE
      - image/**
      - packaging/**
      - hardening/**
      - .gitea/workflows/image.yml
      - .gitea/workflows/rpms.yml
  workflow_dispatch:

concurrency:
  group: desktop-image
  cancel-in-progress: false

env:
  IMAGE: git.lan/mike/locumview-desktop
  SCAN_TYPE: https://locumview.org/attestations/image-stig-scan/v1
  LAN_CA: /usr/local/share/ca-certificates/mkcert-node1.crt

jobs:
  build:
    runs-on: image-builder
    timeout-minutes: 150
    steps:
      - name: Check out
        env:
          TOKEN: ${{ gitea.token }}
        run: |
          set -euo pipefail
          rm -rf src
          git clone -q "https://x-access-token:${TOKEN}@git.lan/${GITHUB_REPOSITORY}.git" src
          git -C src remote set-url origin "https://git.lan/${GITHUB_REPOSITORY}.git"
          git -C src checkout -q "$GITHUB_SHA"
          git -C src log -1 --format='%h %s'
          # Job scratch for credentials: owner-only, removed by the last step.
          install -d -m 0700 "$PWD/.job"
          echo "JOB=$PWD/.job" >> "$GITHUB_ENV"
          echo "TAG=${GITHUB_SHA:0:12}" >> "$GITHUB_ENV"

      - name: Registry logins
        env:
          RH_USER: ${{ secrets.REDHAT_REGISTRY_USER }}
          RH_PASS: ${{ secrets.REDHAT_REGISTRY_PASSWORD }}
          REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
        run: |
          set -euo pipefail
          A="$JOB/auth.json"; printf '{"auths":{}}' > "$A"; chmod 600 "$A"
          printf '%s' "$RH_PASS" | podman login --authfile "$A" --username "$RH_USER" --password-stdin registry.redhat.io
          printf '%s' "$REGISTRY_TOKEN" | podman login --authfile "$A" --username "${GITHUB_REPOSITORY_OWNER}" --password-stdin git.lan
          # cosign and syft read registry credentials from a Docker config directory.
          install -d -m 0700 "$JOB/docker"; ln -sf "$A" "$JOB/docker/config.json"

      - name: Resolve pinned RPM version
        run: |
          set -euo pipefail
          cd src
          read -r SOURCE VERSION RELEASE EVR < <(python3 packaging/rpm/resolve-version.py "$GITHUB_SHA" --check-inputs --format tsv)
          echo "RPM source: $SOURCE; required version-release: $EVR"
          echo "LOCUMVIEW_RPM_EVR=$EVR" >> "$GITHUB_ENV"

      - name: Build
        env:
          RHSM_ORG: ${{ secrets.RHSM_ORG }}
          RHSM_KEY: ${{ secrets.RHSM_ACTIVATION_KEY }}
        run: |
          set -euo pipefail
          R="$JOB/rhsm.env"; umask 077
          printf 'RHSM_ORG=%s\nRHSM_KEY=%s\n' "$RHSM_ORG" "$RHSM_KEY" > "$R"
          trap 'shred -u "$R" 2>/dev/null || true' EXIT
          cd src
          # Host network: the LocumView RPMs come from the registry on the LAN (Containerfile step 1c), which a
          # rootless container network cannot reach on this host; lanca is the registry's CA (public).
          podman build --network host --authfile "$JOB/auth.json" --secret id=rhsm,src="$R" \
            --secret id=lanca,src="$LAN_CA" \
            --build-arg "LOCUMVIEW_RPM_EVR=$LOCUMVIEW_RPM_EVR" \
            --label org.opencontainers.image.revision="$GITHUB_SHA" \
            --label org.opencontainers.image.source="https://git.lan/${GITHUB_REPOSITORY}" \
            -f image/desktop/Containerfile -t "$IMAGE:$TAG" .

      - name: Scan
        run: |
          set -euo pipefail
          # The image STIG profile, scanned inside the image. A failure the image alone can judge stops the build
          # before anything is pushed; rules only an installed desktop can judge are listed in
          # hardening/stig/image-scan-runtime-only.txt.
          src/hardening/stig/scan-image.sh "$IMAGE:$TAG" "$JOB/scan"

      - name: Push
        run: |
          set -euo pipefail
          podman push --retry 3 --authfile "$JOB/auth.json" --digestfile "$JOB/digest" "$IMAGE:$TAG"
          podman push --retry 3 --authfile "$JOB/auth.json" "$IMAGE:$TAG" "docker://$IMAGE:testing"
          echo "DIGEST=$(cat "$JOB/digest")" >> "$GITHUB_ENV"
          echo "pushed $IMAGE:$TAG as $(cat "$JOB/digest")"

      - name: Sign
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
        run: |
          set -euo pipefail
          export DOCKER_CONFIG="$JOB/docker"
          cosign sign --key env://COSIGN_PRIVATE_KEY --new-bundle-format=false --use-signing-config=false --tlog-upload=false -y \
            -a "git.commit=$GITHUB_SHA" -a "ci.run=$GITHUB_RUN_NUMBER" "$IMAGE@$DIGEST"

      - name: SBOM
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
        run: |
          set -euo pipefail
          export DOCKER_CONFIG="$JOB/docker"
          # syft unpacks the image into TMPDIR, which is RAM (tmpfs) for the runner service, and without a Go memory
          # limit grew past 9.6 GiB on node2 next to the clinical workloads, until the API server stopped answering
          # (changelog #92). Unpack on disk and cap the heap: 4.7 GiB peak and under 7 minutes in a test of this image.
          export TMPDIR="$PWD/.syft-tmp" GOMEMLIMIT=3GiB
          rm -rf "$TMPDIR"; install -d -m 0700 "$TMPDIR"
          syft scan "registry:$IMAGE@$DIGEST" -q -o "spdx-json=$JOB/sbom-full.spdx.json"
          rm -rf "$TMPDIR"
          # Packages only: the per-file listing (about 140,000 files) makes the attestation about 160 MB, over the
          # 128 MiB that cosign will read back. Packages and their relationships are what vulnerability tracking uses.
          python3 -I - "$JOB/sbom-full.spdx.json" "$JOB/sbom.spdx.json" <<'PY'
          import json, sys
          d = json.load(open(sys.argv[1]))
          files = {f["SPDXID"] for f in d.pop("files", [])}
          for p in d["packages"]:
              p.pop("hasFiles", None)
          d["relationships"] = [r for r in d.get("relationships", [])
                                if r["spdxElementId"] not in files and r["relatedSpdxElement"] not in files]
          json.dump(d, open(sys.argv[2], "w"), separators=(",", ":"))
          print(len(d["packages"]), "packages in the SBOM")
          PY
          cosign attest --key env://COSIGN_PRIVATE_KEY --new-bundle-format=false --use-signing-config=false --tlog-upload=false -y \
            --type spdxjson --predicate "$JOB/sbom.spdx.json" "$IMAGE@$DIGEST"

      - name: Attest the scan
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
        run: |
          set -euo pipefail
          export DOCKER_CONFIG="$JOB/docker"
          cosign attest --key env://COSIGN_PRIVATE_KEY --new-bundle-format=false --use-signing-config=false --tlog-upload=false -y \
            --type "$SCAN_TYPE" --predicate "$JOB/scan/summary.json" "$IMAGE@$DIGEST"

      - name: Verify
        run: |
          set -euo pipefail
          export DOCKER_CONFIG="$JOB/docker"
          cosign verify --key src/image/desktop/signing/cosign.pub --insecure-ignore-tlog "$IMAGE@$DIGEST" >/dev/null
          cosign verify-attestation --key src/image/desktop/signing/cosign.pub --insecure-ignore-tlog --type spdxjson \
            "$IMAGE@$DIGEST" >/dev/null
          cosign verify-attestation --key src/image/desktop/signing/cosign.pub --insecure-ignore-tlog --type "$SCAN_TYPE" \
            "$IMAGE@$DIGEST" >/dev/null
          echo "verified: signature, SBOM and scan attestations for $IMAGE@$DIGEST ($IMAGE:$TAG, also :testing)"
          echo "promote with the promote workflow (digest $DIGEST)"

      - name: Clean up
        if: always()
        run: |
          set -uo pipefail
          [ -n "${JOB:-}" ] && find "$JOB" -type f -exec shred -u {} + 2>/dev/null; rm -rf "${JOB:-/nonexistent}" src .syft-tmp
          # Keep the newest two desktop images locally (layer cache for the next build); drop the rest.
          podman images --format '{{.ID}} {{.Repository}}' | awk -v r="$IMAGE" '$2==r {print $1}' | tail -n +3 | xargs -r podman rmi -f >/dev/null 2>&1 || true
          podman image prune -f >/dev/null 2>&1 || true
          df -h "$HOME" | tail -1
